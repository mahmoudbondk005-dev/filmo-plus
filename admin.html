<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم فيلمو+</title>
<style>
body{font-family:Tahoma,Arial;background:#0b0d12;color:#fff;margin:0}
.box{max-width:700px;margin:35px auto;padding:22px;background:#151922;border-radius:16px}
input,textarea,select{width:100%;padding:12px;margin:7px 0 15px;background:#0d1016;color:#fff;border:1px solid #303744;border-radius:8px;box-sizing:border-box}
button{background:#ffb000;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
h1{color:#ffb000}.msg{margin-top:15px;padding:10px;border-radius:8px;display:none}
</style>
</head>
<body>
<div class="box">
<h1>فيلمو+ — لوحة التحكم</h1>
<p>إضافة فيلم أو مسلسل إلى قاعدة بيانات الموقع.</p>

<label>اسم المحتوى</label>
<input id="title" placeholder="مثال: الفيل الأزرق">

<label>النوع</label>
<select id="category"><option value="فيلم">فيلم</option><option value="مسلسل">مسلسل</option></select>

<label>السنة</label>
<input id="year" type="number" placeholder="2026">

<label>التقييم</label>
<input id="rating" type="number" step="0.1" placeholder="8.0">

<label>الوصف</label>
<textarea id="description" rows="5" placeholder="قصة العمل"></textarea>

<label>رابط الصورة</label>
<input id="poster_url" placeholder="https://...">

<label>رابط الفيديو المرخّص</label>
<input id="movie_url" placeholder="https://...">

<button id="saveBtn" onclick="saveMovie()">حفظ في قاعدة البيانات</button>
<div id="msg" class="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://axvibvssjizkrfdqlyow.supabase.co";
const SUPABASE_KEY = "sb_publishable_72qMAroeSPFAMXfL2AoVQA_5RnDslsh";
const TABLE_URL = SUPABASE_URL + "/rest/v1/movies";

function message(text, ok=false){
  const el=document.getElementById("msg");
  el.style.display="block";
  el.style.background=ok ? "#173d25" : "#4a2020";
  el.textContent=text;
}

async function saveMovie(){
  const title=document.getElementById("title").value.trim();
  if(!title){ message("اكتب اسم المحتوى أولًا."); return; }

  const payload={
    title,
    category:document.getElementById("category").value,
    year:document.getElementById("year").value ? Number(document.getElementById("year").value) : null,
    rating:document.getElementById("rating").value ? Number(document.getElementById("rating").value) : null,
    description:document.getElementById("description").value.trim(),
    poster_url:document.getElementById("poster_url").value.trim() || null,
    movie_url:document.getElementById("movie_url").value.trim() || null
  };

  try{
    document.getElementById("saveBtn").disabled=true;
    const res=await fetch(TABLE_URL,{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!res.ok){
      const text=await res.text();
      throw new Error(text || "فشل الحفظ");
    }
    message("تم حفظ المحتوى بنجاح في قاعدة البيانات. ✅",true);
    ["title","year","rating","description","poster_url","movie_url"].forEach(id=>document.getElementById(id).value="");
  }catch(e){
    console.error(e);
    message("فشل الحفظ. تأكد من مفتاح Supabase وصلاحيات جدول movies.");
  }finally{
    document.getElementById("saveBtn").disabled=false;
  }
}
</script>
</body>
</html>
