<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم فيلمو</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;background:#0b0d12;color:#fff;margin:0;min-height:100vh}
.box{max-width:760px;margin:40px auto;padding:28px;background:#151922;border-radius:18px;border:1px solid #242a35}
h1{color:#ffb000;margin:0 0 8px;font-size:26px}
.sub{color:#8d929d;margin:0 0 22px;font-size:14px}
label{display:block;margin:4px 0 6px;color:#c7cad1;font-size:14px}
input,textarea,select{width:100%;padding:12px 14px;margin:0 0 16px;background:#0d1016;color:#fff;border:1px solid #303744;border-radius:10px;font-size:15px}
input:focus,textarea:focus,select:focus{outline:0;border-color:#ffb000}
button{background:#ffb000;color:#111;border:0;padding:13px 22px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#252b35;color:#fff}
button.danger{background:#5a2020;color:#fff}
button.small{padding:8px 14px;font-size:13px}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;display:none;font-size:14px}
.login-box{max-width:400px;margin:12vh auto;text-align:center}
.login-box input{text-align:center;letter-spacing:2px}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.list{margin-top:36px}
.list h2{font-size:18px;margin:0 0 14px;color:#ffb000}
.item{background:#0d1016;border:1px solid #242a35;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.item .info{flex:1;min-width:0}
.item .info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:#8d929d;margin-top:4px}
.item .actions{display:flex;gap:6px;flex-shrink:0}
.badge{display:inline-block;background:#252b35;color:#ffb000;padding:3px 8px;border-radius:6px;font-size:11px}
.logout{background:transparent;border:1px solid #444;color:#aaa;padding:8px 14px;font-size:13px}
.note{background:#1a1f2a;border:1px solid #2a3140;border-radius:10px;padding:12px 14px;font-size:13px;color:#9aa0ab;margin-bottom:20px;line-height:1.7}
.req{color:#ff6b6b;font-size:12px}
.form-title{font-size:18px;color:#ffb000;margin:0 0 16px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ep-box{background:#0d1016;border:1px solid #303744;border-radius:12px;padding:14px;margin-bottom:16px}
.ep-box h3{margin:0 0 12px;font-size:15px;color:#ffb000}
.ep-row{display:grid;grid-template-columns:80px 1fr 1.4fr 40px;gap:8px;margin-bottom:8px;align-items:center}
.ep-row input{margin:0}
.ep-row button{padding:10px;margin:0}
@media(max-width:600px){.ep-row{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="loginScreen" class="box login-box">
  <h1>فيلمو</h1>
  <p class="sub">لوحة التحكم — للمسؤول فقط</p>
  <label>كلمة المرور</label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()" style="width:100%;margin-top:6px">دخول</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="adminPanel" class="box hidden">
  <div class="topbar">
    <div>
      <h1>لوحة التحكم</h1>
      <p class="sub" style="margin:0">إضافة وتعديل وحذف المحتوى</p>
    </div>
    <button class="logout" onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="note">
    للأفلام: حط رابط واحد للمشاهدة.<br>
    للمسلسلات: ضيف الحلقات من قسم الحلقات بالأسفل.
  </div>

  <h2 class="form-title" id="formTitle">إضافة محتوى جديد</h2>
  <input type="hidden" id="editId" value="">

  <label>اسم المحتوى <span class="req">*</span></label>
  <input id="title" placeholder="مثال: الفيل الأزرق / اختيار إجباري">

  <label>القسم <span class="req">*</span></label>
  <select id="category" onchange="toggleEpisodesUI()">
    <option value="أفلام عربي">أفلام عربي</option>
    <option value="أفلام أجنبي">أفلام أجنبي</option>
    <option value="مسلسلات عربي">مسلسلات عربي</option>
    <option value="مسلسلات أجنبي">مسلسلات أجنبي</option>
  </select>

  <label>السنة</label>
  <input id="year" type="number" placeholder="2024" min="1900" max="2030">

  <label>التقييم</label>
  <input id="rating" type="number" step="0.1" min="0" max="10" placeholder="8.0">

  <label>المدة <span class="req">*</span></label>
  <input id="duration" placeholder="مثال: 130 دقيقة / 20 حلقة" value="—">

  <label>الوصف</label>
  <textarea id="description" rows="4" placeholder="قصة العمل باختصار"></textarea>

  <label>رابط الصورة (Poster) <span class="req">*</span></label>
  <input id="poster_url" placeholder="https://..." value="https://via.placeholder.com/500x750?text=Filmo">

  <!-- للأفلام -->
  <div id="movieUrlBox">
    <label>رابط الفيديو / المشاهدة <span class="req">*</span></label>
    <input id="movie_url" placeholder="https://..." value="https://example.com">
  </div>

  <!-- للمسلسلات -->
  <div id="episodesBox" class="ep-box hidden">
    <h3>الحلقات</h3>
    <div id="episodesList"></div>
    <button type="button" class="secondary small" onclick="addEpisodeRow()">+ إضافة حلقة</button>
  </div>

  <div class="btns">
    <button id="saveBtn" onclick="saveMovie()">حفظ</button>
    <button id="cancelBtn" class="secondary hidden" onclick="cancelEdit()">إلغاء التعديل</button>
  </div>
  <div id="msg" class="msg"></div>

  <div class="list">
    <h2>المحتوى الموجود حالياً</h2>
    <div id="moviesList"><p style="color:#8d929d">جاري التحميل...</p></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://axvibvssjizkrfdqlyow.supabase.co";
const SUPABASE_KEY = "sb_publishable_72qMAroeSPFAMXfL2AoVQA_5RnDslsh";
const TABLE_URL = SUPABASE_URL + "/rest/v1/movies";
const ADMIN_PASSWORD = "Filmo2026";
const SESSION_KEY = "filmo_admin_ok";
const VALID_CATEGORIES = ["أفلام عربي", "أفلام أجنبي", "مسلسلات عربي", "مسلسلات أجنبي"];

let allMovies = [];
let idColumn = "Id";
let episodeCounter = 0;

function isSeries(cat) {
  return cat === "مسلسلات عربي" || cat === "مسلسلات أجنبي";
}

function isLoggedIn() {
  return sessionStorage.getItem(SESSION_KEY) === "1";
}

function login() {
  const pass = document.getElementById("password").value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, "1");
    showAdmin();
  } else {
    showLoginMsg("كلمة المرور غير صحيحة");
  }
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("password").value = "";
}

function showAdmin() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  toggleEpisodesUI();
  loadList();
}

function showLoginMsg(text) {
  const el = document.getElementById("loginMsg");
  el.style.display = "block";
  el.style.background = "#4a2020";
  el.textContent = text;
}

function message(text, ok = false) {
  const el = document.getElementById("msg");
  el.style.display = "block";
  el.style.background = ok ? "#173d25" : "#4a2020";
  el.textContent = text;
}

function headers(extra = {}) {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    ...extra
  };
}

function mapOldCategory(cat) {
  const c = (cat || "").trim();
  if (VALID_CATEGORIES.includes(c)) return c;
  if (c === "مسلسل") return "مسلسلات عربي";
  return "أفلام عربي";
}

function toggleEpisodesUI() {
  const cat = document.getElementById("category").value;
  const series = isSeries(cat);
  document.getElementById("episodesBox").classList.toggle("hidden", !series);
  document.getElementById("movieUrlBox").classList.toggle("hidden", series);
  if (series && !document.getElementById("episodesList").children.length) {
    addEpisodeRow();
    addEpisodeRow();
  }
}

function addEpisodeRow(title, url) {
  episodeCounter++;
  const id = episodeCounter;
  const row = document.createElement("div");
  row.className = "ep-row";
  row.id = "ep-" + id;
  row.innerHTML =
    '<input type="text" placeholder="رقم" value="' + escapeAttr(title ? "" : String(id)) + '" data-ep-num>' +
    '<input type="text" placeholder="اسم الحلقة (اختياري)" value="' + escapeAttr(title || "") + '" data-ep-title>' +
    '<input type="text" placeholder="رابط الحلقة https://..." value="' + escapeAttr(url || "") + '" data-ep-url>' +
    '<button type="button" class="danger small" onclick="removeEpisodeRow(' + id + ')">×</button>';
  // fix: first field should be episode number label style - simplify
  row.innerHTML =
    '<input type="text" placeholder="الحلقة 1" value="' + escapeAttr(title || ("الحلقة " + id)) + '" data-ep-title>' +
    '<input type="text" placeholder="رابط الحلقة" value="' + escapeAttr(url || "") + '" data-ep-url style="grid-column: span 2">' +
    '<button type="button" class="danger small" onclick="removeEpisodeRow(' + id + ')">×</button>';
  document.getElementById("episodesList").appendChild(row);
}

function removeEpisodeRow(id) {
  const el = document.getElementById("ep-" + id);
  if (el) el.remove();
}

function getEpisodesFromForm() {
  const rows = document.querySelectorAll("#episodesList .ep-row");
  const list = [];
  rows.forEach(row => {
    const title = (row.querySelector("[data-ep-title]") || {}).value || "";
    const url = (row.querySelector("[data-ep-url]") || {}).value || "";
    if (url.trim()) {
      list.push({ title: title.trim() || ("حلقة " + (list.length + 1)), url: url.trim() });
    }
  });
  return list;
}

function setEpisodesForm(episodes) {
  const box = document.getElementById("episodesList");
  box.innerHTML = "";
  episodeCounter = 0;
  if (Array.isArray(episodes) && episodes.length) {
    episodes.forEach(ep => addEpisodeRow(ep.title || "", ep.url || ""));
  } else {
    addEpisodeRow();
  }
}

function parseEpisodes(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val;
  try {
    const p = JSON.parse(val);
    return Array.isArray(p) ? p : [];
  } catch {
    return [];
  }
}

function getPayload() {
  const title = document.getElementById("title").value.trim();
  let poster = document.getElementById("poster_url").value.trim();
  let duration = document.getElementById("duration").value.trim();
  if (!poster) poster = "https://via.placeholder.com/500x750?text=Filmo";
  if (!duration) duration = "—";

  const cat = document.getElementById("category").value;
  let movieUrl = document.getElementById("movie_url").value.trim() || "https://example.com";
  let episodes = [];

  if (isSeries(cat)) {
    episodes = getEpisodesFromForm();
    movieUrl = episodes.length ? episodes[0].url : "https://example.com";
  }

  return {
    title,
    category: cat,
    year: document.getElementById("year").value ? Number(document.getElementById("year").value) : null,
    rating: document.getElementById("rating").value ? Number(document.getElementById("rating").value) : null,
    description: document.getElementById("description").value.trim() || null,
    poster_url: poster,
    movie_url: movieUrl,
    duration: duration,
    episodes: JSON.stringify(episodes)
  };
}

function resetForm() {
  document.getElementById("editId").value = "";
  document.getElementById("formTitle").textContent = "إضافة محتوى جديد";
  document.getElementById("saveBtn").textContent = "حفظ";
  document.getElementById("cancelBtn").classList.add("hidden");
  document.getElementById("title").value = "";
  document.getElementById("year").value = "";
  document.getElementById("rating").value = "";
  document.getElementById("description").value = "";
  document.getElementById("duration").value = "—";
  document.getElementById("poster_url").value = "https://via.placeholder.com/500x750?text=Filmo";
  document.getElementById("movie_url").value = "https://example.com";
  document.getElementById("category").value = "أفلام عربي";
  document.getElementById("episodesList").innerHTML = "";
  episodeCounter = 0;
  toggleEpisodesUI();
}

function cancelEdit() {
  resetForm();
  message("تم إلغاء التعديل", true);
}

function startEdit(id) {
  const row = allMovies.find(r => String(r.Id ?? r.id) === String(id));
  if (!row) return;

  document.getElementById("editId").value = id;
  document.getElementById("formTitle").textContent = "تعديل: " + (row.title || "");
  document.getElementById("saveBtn").textContent = "حفظ التعديلات";
  document.getElementById("cancelBtn").classList.remove("hidden");

  document.getElementById("title").value = row.title || "";
  document.getElementById("category").value = mapOldCategory(row.category);
  document.getElementById("year").value = row.year || "";
  document.getElementById("rating").value = row.rating != null ? row.rating : "";
  document.getElementById("duration").value = row.duration || "—";
  document.getElementById("description").value = row.description || "";
  document.getElementById("poster_url").value = row.poster_url || "";
  document.getElementById("movie_url").value = row.movie_url || "";

  toggleEpisodesUI();
  if (isSeries(mapOldCategory(row.category))) {
    setEpisodesForm(parseEpisodes(row.episodes));
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function saveMovie() {
  const title = document.getElementById("title").value.trim();
  if (!title) {
    message("اكتب اسم المحتوى أولًا.");
    return;
  }

  const cat = document.getElementById("category").value;
  if (isSeries(cat)) {
    const eps = getEpisodesFromForm();
    if (!eps.length) {
      message("ضيف حلقة واحدة على الأقل مع رابطها.");
      return;
    }
  }

  const payload = getPayload();
  const editId = document.getElementById("editId").value;
  const isEdit = !!editId;

  try {
    document.getElementById("saveBtn").disabled = true;
    let res;
    if (isEdit) {
      res = await fetch(TABLE_URL + "?" + idColumn + "=eq." + encodeURIComponent(editId), {
        method: "PATCH",
        headers: headers({ "Prefer": "return=minimal" }),
        body: JSON.stringify(payload)
      });
    } else {
      res = await fetch(TABLE_URL, {
        method: "POST",
        headers: headers({ "Prefer": "return=minimal" }),
        body: JSON.stringify(payload)
      });
    }
    if (!res.ok) {
      const text = await res.text();
      if (text.includes("episodes") || text.includes("PGRST204")) {
        throw new Error("عمود episodes مش موجود. ضيفه من Supabase (شرح تحت).");
      }
      throw new Error(text || "فشل الحفظ");
    }

    message(isEdit ? "تم تحديث المحتوى بنجاح ✅" : "تم حفظ المحتوى بنجاح ✅", true);
    resetForm();
    loadList();
  } catch (e) {
    console.error(e);
    message("فشل الحفظ: " + (e.message || "خطأ"));
  } finally {
    document.getElementById("saveBtn").disabled = false;
  }
}

async function deleteMovie(id) {
  if (!confirm("هل أنت متأكد من حذف هذا المحتوى؟")) return;
  try {
    const res = await fetch(TABLE_URL + "?" + idColumn + "=eq." + encodeURIComponent(id), {
      method: "DELETE",
      headers: headers({ "Prefer": "return=minimal" })
    });
    if (!res.ok) throw new Error(await res.text() || "فشل الحذف");
    message("تم الحذف بنجاح ✅", true);
    if (document.getElementById("editId").value === String(id)) resetForm();
    loadList();
  } catch (e) {
    console.error(e);
    message("فشل الحذف: " + (e.message || "خطأ"));
  }
}

async function loadList() {
  const box = document.getElementById("moviesList");
  try {
    let res = await fetch(TABLE_URL + "?select=*&order=id.desc", { headers: headers() });
    if (!res.ok) {
      res = await fetch(TABLE_URL + "?select=*&order=Id.desc", { headers: headers() });
      idColumn = "Id";
    } else idColumn = "id";
    if (!res.ok) throw new Error(await res.text());

    const rows = await res.json();
    allMovies = rows;
    if (rows.length) {
      if (rows[0].Id !== undefined) idColumn = "Id";
      else if (rows[0].id !== undefined) idColumn = "id";
    }

    if (!rows.length) {
      box.innerHTML = '<p style="color:#8d929d">لا يوجد محتوى بعد.</p>';
      return;
    }

    box.innerHTML = rows.map(r => {
      const id = r.Id ?? r.id ?? "";
      const cat = mapOldCategory(r.category);
      const year = r.year || "—";
      const rating = r.rating != null ? r.rating : "—";
      const eps = parseEpisodes(r.episodes);
      const extra = isSeries(cat) ? (" • " + eps.length + " حلقة") : "";
      return '<div class="item">' +
        '<div class="info"><strong>' + escapeHtml(r.title || "") +
        '</strong><div class="meta">' + escapeHtml(cat) + ' • ' + year + ' • ⭐ ' + rating + extra +
        ' <span class="badge">#' + id + '</span></div></div>' +
        '<div class="actions">' +
        '<button class="secondary small" onclick="startEdit(\'' + id + '\')">تعديل</button>' +
        '<button class="danger small" onclick="deleteMovie(\'' + id + '\')">حذف</button>' +
        '</div></div>';
    }).join("");
  } catch (e) {
    console.error(e);
    box.innerHTML = '<p style="color:#c44">تعذر تحميل القائمة.</p>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[c]));
}
function escapeAttr(s) {
  return String(s).replace(/"/g, "&quot;");
}

if (isLoggedIn()) showAdmin();
</script>
</body>
</html>
