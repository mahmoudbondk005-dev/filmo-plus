<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم فيلمو+</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;background:#0b0d12;color:#fff;margin:0;min-height:100vh}
.box{max-width:720px;margin:40px auto;padding:28px;background:#151922;border-radius:18px;border:1px solid #242a35}
h1{color:#ffb000;margin:0 0 8px;font-size:26px}
.sub{color:#8d929d;margin:0 0 22px;font-size:14px}
label{display:block;margin:4px 0 6px;color:#c7cad1;font-size:14px}
input,textarea,select{width:100%;padding:12px 14px;margin:0 0 16px;background:#0d1016;color:#fff;border:1px solid #303744;border-radius:10px;font-size:15px}
input:focus,textarea:focus,select:focus{outline:0;border-color:#ffb000}
button{background:#ffb000;color:#111;border:0;padding:13px 22px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;display:none;font-size:14px}
.login-box{max-width:400px;margin:12vh auto;text-align:center}
.login-box input{text-align:center;letter-spacing:2px}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.list{margin-top:36px}
.list h2{font-size:18px;margin:0 0 14px;color:#ffb000}
.item{background:#0d1016;border:1px solid #242a35;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.item .info{flex:1;min-width:0}
.item .info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:#8d929d;margin-top:4px}
.badge{display:inline-block;background:#252b35;color:#ffb000;padding:3px 8px;border-radius:6px;font-size:11px}
.logout{background:transparent;border:1px solid #444;color:#aaa;padding:8px 14px;font-size:13px}
.logout:hover{border-color:#ffb000;color:#ffb000}
.note{background:#1a1f2a;border:1px solid #2a3140;border-radius:10px;padding:12px 14px;font-size:13px;color:#9aa0ab;margin-bottom:20px;line-height:1.7}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" class="box login-box">
  <h1>فيلمو+</h1>
  <p class="sub">لوحة التحكم — للمسؤول فقط</p>
  <label>كلمة المرور</label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()" style="width:100%;margin-top:6px">دخول</button>
  <div id="loginMsg" class="msg"></div>
</div>

<!-- لوحة التحكم -->
<div id="adminPanel" class="box hidden">
  <div class="topbar">
    <div>
      <h1>لوحة التحكم</h1>
      <p class="sub" style="margin:0">إضافة وإدارة المحتوى</p>
    </div>
    <button class="logout" onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="note">
    الصفحة دي مش مربوطة بالموقع العام. ادخل عليها من الرابط مباشرة:<br>
    <code style="color:#ffb000">yoursite.com/admin.html</code>
  </div>

  <label>اسم المحتوى</label>
  <input id="title" placeholder="مثال: الفيل الأزرق">

  <label>النوع</label>
  <select id="category">
    <option value="فيلم">فيلم</option>
    <option value="مسلسل">مسلسل</option>
  </select>

  <label>السنة</label>
  <input id="year" type="number" placeholder="2024" min="1900" max="2030">

  <label>التقييم</label>
  <input id="rating" type="number" step="0.1" min="0" max="10" placeholder="8.0">

  <label>الوصف</label>
  <textarea id="description" rows="4" placeholder="قصة العمل باختصار"></textarea>

  <label>رابط الصورة (Poster)</label>
  <input id="poster_url" placeholder="https://...">

  <label>رابط الفيديو / المشاهدة</label>
  <input id="movie_url" placeholder="https://...">

  <button id="saveBtn" onclick="saveMovie()">حفظ في قاعدة البيانات</button>
  <div id="msg" class="msg"></div>

  <div class="list">
    <h2>المحتوى الموجود حالياً</h2>
    <div id="moviesList"><p style="color:#8d929d">جاري التحميل...</p></div>
  </div>
</div>

<script>
/* ========== إعدادات ========== */
const SUPABASE_URL = "https://axvibvssjizkrfdqlyow.supabase.co";
const SUPABASE_KEY = "sb_publishable_72qMAroeSPFAMXfL2AoVQA_5RnDslsh";
const TABLE_URL = SUPABASE_URL + "/rest/v1/movies";

/* غيّر كلمة المرور دي للي انت عايزه */
const ADMIN_PASSWORD = "Filmo2026";

const SESSION_KEY = "filmo_admin_ok";

/* ========== حماية الدخول ========== */
function isLoggedIn() {
  return sessionStorage.getItem(SESSION_KEY) === "1";
}

function login() {
  const pass = document.getElementById("password").value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, "1");
    showAdmin();
  } else {
    showLoginMsg("كلمة المرور غير صحيحة");
  }
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("password").value = "";
}

function showAdmin() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  loadList();
}

function showLoginMsg(text) {
  const el = document.getElementById("loginMsg");
  el.style.display = "block";
  el.style.background = "#4a2020";
  el.textContent = text;
}

/* ========== رسائل ========== */
function message(text, ok = false) {
  const el = document.getElementById("msg");
  el.style.display = "block";
  el.style.background = ok ? "#173d25" : "#4a2020";
  el.textContent = text;
}

/* ========== إضافة فيلم ========== */
async function saveMovie() {
  const title = document.getElementById("title").value.trim();
  if (!title) {
    message("اكتب اسم المحتوى أولًا.");
    return;
  }

  const payload = {
    title,
    category: document.getElementById("category").value,
    year: document.getElementById("year").value ? Number(document.getElementById("year").value) : null,
    rating: document.getElementById("rating").value ? Number(document.getElementById("rating").value) : null,
    description: document.getElementById("description").value.trim() || null,
    poster_url: document.getElementById("poster_url").value.trim() || null,
    movie_url: document.getElementById("movie_url").value.trim() || null
  };

  try {
    document.getElementById("saveBtn").disabled = true;
    const res = await fetch(TABLE_URL, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || "فشل الحفظ");
    }
    message("تم حفظ المحتوى بنجاح ✅", true);
    ["title", "year", "rating", "description", "poster_url", "movie_url"].forEach(id => {
      document.getElementById(id).value = "";
    });
    loadList();
  } catch (e) {
    console.error(e);
    message("فشل الحفظ. تأكد من صلاحيات جدول movies في Supabase.");
  } finally {
    document.getElementById("saveBtn").disabled = false;
  }
}

/* ========== عرض القائمة ========== */
async function loadList() {
  const box = document.getElementById("moviesList");
  try {
    const res = await fetch(
      TABLE_URL + "?select=*&order=id.desc",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );
    if (!res.ok) {
      // جرب Id بحرف كبير لو فشل
      const res2 = await fetch(
        TABLE_URL + "?select=*&order=Id.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        }
      );
      if (!res2.ok) throw new Error(await res2.text());
      const rows = await res2.json();
      renderList(rows, box);
      return;
    }
    const rows = await res.json();
    renderList(rows, box);
  } catch (e) {
    console.error(e);
    box.innerHTML = '<p style="color:#c44">تعذر تحميل القائمة.</p>';
  }
}

function renderList(rows, box) {
  if (!rows.length) {
    box.innerHTML = '<p style="color:#8d929d">لا يوجد محتوى بعد.</p>';
    return;
  }
  box.innerHTML = rows.map(r => {
    const id = r.Id ?? r.id ?? "—";
    const cat = r.category || "—";
    const year = r.year || "—";
    const rating = r.rating != null ? r.rating : "—";
    return '<div class="item"><div class="info"><strong>' + escapeHtml(r.title || "") +
      '</strong><div class="meta">' + escapeHtml(cat) + ' • ' + year + ' • ⭐ ' + rating +
      '</div></div><span class="badge">#' + id + '</span></div>';
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[c]));
}

/* تشغيل */
if (isLoggedIn()) showAdmin();
</script>
</body>
</html>
